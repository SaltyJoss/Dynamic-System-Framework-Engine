name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install VS 2026 Build Tools (C++ / v145)
        shell: pwsh
        run: |
          $exitCode = 0
          choco install visualstudio2026buildtools --yes --no-progress --package-parameters `
            "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 3010) {
            Write-Host "Installation succeeded but requires reboot (exit code 3010). Continuing without reboot."
            exit 0
          } elseif ($exitCode -ne 0) {
            Write-Host "Installation failed with exit code $exitCode"
            exit $exitCode
          }
            
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Verify MSBuild and toolset
        shell: pwsh
        run: |
          msbuild -version
          vswhere -latest -products * -property installationPath

      - name: Clean build folders
        shell: pwsh
        run: |
          $folders = @("bin","bin-int","out","x64","build")
          foreach ($f in $folders) {
            if (Test-Path $f) { Remove-Item -Recurse -Force $f }
          }

      - name: Rebuild Release (v145)
        shell: pwsh
        run: |
          msbuild "Sim_Engine/Engine.sln" `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v145 `
            /m
