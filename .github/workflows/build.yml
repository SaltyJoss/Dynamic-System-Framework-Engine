name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Add VS 2026 components
      run: |
        # Install Visual Studio 2026 build tools with v145 platform toolset
        choco install visualstudio2026buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.v145.x86.x64"

    - name: Clean build folders
      run: |
        if (Test-Path bin) { Remove-Item -Recurse -Force bin }
        if (Test-Path bin-int) { Remove-Item -Recurse -Force bin-int }
        if (Test-Path out) { Remove-Item -Recurse -Force out }
        if (Test-Path x64) { Remove-Item -Recurse -Force x64 }
        if (Test-Path build) { Remove-Item -Recurse -Force build }

    - name: Force clean Release build
      run: |
        msbuild Sim_Engine/Engine.sln /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:RuntimeLibrary=MultiThreadedDLL /p:PlatformToolset=v145 /m
